<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>튜너 아이콘 원본 (줄과 페그, 라이트)</title>
  <!-- 배경: 전면 채움 (maskable 대응). 핵심 도형은 중앙 지름 약 390px 안쪽 -->
  <rect width="512" height="512" fill="#F6F4EF"/>
  <!-- 대기 중인 줄 -->
  <g stroke="#C9CCD4" stroke-linecap="round">
    <line x1="176" y1="150" x2="410" y2="150" stroke-width="9"/>
    <line x1="176" y1="294" x2="410" y2="294" stroke-width="7"/>
    <line x1="176" y1="366" x2="410" y2="366" stroke-width="6"/>
  </g>
  <g fill="#F6F4EF" stroke="#C9CCD4" stroke-width="8">
    <circle cx="116" cy="150" r="32"/>
    <circle cx="116" cy="294" r="32"/>
    <circle cx="116" cy="366" r="32"/>
  </g>
  <!-- 선택된 줄: 늘어져 휜 모양 -->
  <path d="M176 222 Q293 312 410 222" fill="none" stroke="#E08A00" stroke-width="16" stroke-linecap="round"/>
  <line x1="176" y1="222" x2="410" y2="222" stroke="#C9CCD4" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
  <circle cx="116" cy="222" r="38" fill="#E08A00"/>
</svg>
