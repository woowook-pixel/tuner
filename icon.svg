<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>튜너 아이콘 원본 (눈금 테이프와 중심 핀)</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1FD68A"/><stop offset="1" stop-color="#0E9F63"/></linearGradient></defs>
  <!-- 배경: 전면 채움 (maskable 대응). 핵심 도형은 중앙 지름 약 380px 안쪽 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 눈금 테이프: 화면의 흐르는 눈금을 그대로 옮긴 모양 -->
  <g fill="#04170D" stroke-linecap="round">
    <rect x="80" y="208.0" width="12" height="96" rx="6" opacity="0.45"/>
    <rect x="114" y="228.0" width="12" height="56" rx="6" opacity="0.56"/>
    <rect x="148" y="228.0" width="12" height="56" rx="6" opacity="0.67"/>
    <rect x="182" y="228.0" width="12" height="56" rx="6" opacity="0.78"/>
    <rect x="216" y="228.0" width="12" height="56" rx="6" opacity="0.89"/>
    <rect x="284" y="228.0" width="12" height="56" rx="6" opacity="0.89"/>
    <rect x="318" y="228.0" width="12" height="56" rx="6" opacity="0.78"/>
    <rect x="352" y="228.0" width="12" height="56" rx="6" opacity="0.67"/>
    <rect x="386" y="228.0" width="12" height="56" rx="6" opacity="0.56"/>
    <rect x="420" y="208.0" width="12" height="96" rx="6" opacity="0.45"/>
  </g>
  <!-- 중심 핀과 위쪽 삼각 표시 -->
  <rect x="238" y="146" width="36" height="220" rx="18" fill="#04170D"/>
  <path d="M256 112 L226 70 L286 70 Z" fill="#04170D" transform="translate(0 4)"/>
</svg>
