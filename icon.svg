<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>튜너 아이콘 원본 (현과 튜닝 막대)</title>
  <!-- 배경: 전면 채움 (maskable 대응). 핵심 도형은 중앙 지름 약 390px 안쪽 -->
  <rect width="512" height="512" fill="#0F172A"/>
  <!-- 기타 줄 6개: 굵기와 간격을 같게 맞춰 선이 고르게 보이게 함, 맞춰진 줄은 초록 -->
  <rect x="112" y="100" width="24" height="312" rx="12" fill="#475569"/><rect x="160" y="100" width="24" height="312" rx="12" fill="#475569"/><rect x="208" y="100" width="24" height="312" rx="12" fill="#475569"/><rect x="256" y="100" width="24" height="312" rx="12" fill="#34D676"/><rect x="304" y="100" width="24" height="312" rx="12" fill="#475569"/><rect x="352" y="100" width="24" height="312" rx="12" fill="#475569"/>
  <!-- 튜닝 막대: 줄 위를 가로지르는 인디케이터 -->
  <rect x="80" y="232" width="352" height="48" rx="24" fill="#34D676"/>
  <circle cx="256" cy="256" r="10" fill="#0F172A"/>
</svg>
