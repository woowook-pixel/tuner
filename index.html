<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>튜너</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="튜너">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C0D10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#14161A; --muted:#757A85;
  --accent:#2F6BFF; --on-accent:#FFFFFF; --good:#0FA968; --off:#E5405E; --line:#DADDE4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0D10; --surface:#17191E; --ink:#F2F3F5; --muted:#8A8F9A;
    --accent:#7C9CFF; --on-accent:#0C0D10; --good:#3DDC97; --off:#FF6B88; --line:#2A2D35;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0D10; --surface:#17191E; --ink:#F2F3F5; --muted:#8A8F9A;
  --accent:#7C9CFF; --on-accent:#0C0D10; --good:#3DDC97; --off:#FF6B88; --line:#2A2D35;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:16px 20px 20px}

/* 상단 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;
  padding:8px 18px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ref{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.ref button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.ref output{min-width:64px;text-align:center;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* 중앙 판독부 */
.readout{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
.note{font-weight:700;font-size:clamp(72px,22vw,104px);line-height:1;letter-spacing:-.04em;
  color:var(--ink);transition:color .15s;margin-bottom:16px}
.note sub{font-size:.3em;font-weight:600;color:var(--muted);vertical-align:baseline;margin-left:4px;letter-spacing:0}
.readout[data-state="good"] .note{color:var(--good)}
.readout[data-state="off"] .note{color:var(--off)}
.readout[data-state="idle"] .note{color:var(--line)}

.meter{width:100%;max-height:100%;display:block}
.meter .card{fill:var(--surface);stroke:var(--line);stroke-width:1}
.meter .tk{stroke:var(--muted);stroke-linecap:round}
.meter .tk.mid{stroke:var(--ink)}
.meter .lbl{fill:var(--muted);font:600 9px "IBM Plex Sans KR",system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}
.meter .zone{fill:none;stroke:var(--good);stroke-width:5;stroke-linecap:round}
.meter .side{fill:var(--muted);font:600 11px "IBM Plex Sans KR",system-ui,sans-serif}
.meter .needle{stroke:var(--ink);stroke-linecap:round;transition:stroke .15s}
.meter .hub{fill:var(--ink);transition:fill .15s}
.meter .hubdot{fill:var(--surface)}
#needle{transition:opacity .3s}
.readout[data-state="idle"] #needle{opacity:.3}
.readout[data-state="good"] .needle{stroke:var(--good)}
.readout[data-state="good"] .hub{fill:var(--good)}
.readout[data-state="off"] .needle{stroke:var(--off)}
.readout[data-state="off"] .hub{fill:var(--off)}
.status{margin-top:18px;font-size:18px;font-weight:600;min-height:1.4em}
.hz{font-size:14px;color:var(--muted);min-height:1.3em;font-variant-numeric:tabular-nums}

/* 줄 */
.strings{display:flex;gap:8px;margin:12px 0 8px}
.str{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:60px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:0;cursor:pointer;color:var(--ink);font:inherit;font-weight:700;font-size:18px;
  transition:border-color .15s}
.str small{font-size:11px;font-weight:600;color:var(--muted)}
.str.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.str.locked{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
.str.locked small{color:var(--bg);opacity:.7}
.str.ring{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good);animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.str.ring{animation:none}}

.bottom{display:flex;gap:12px;margin-top:12px}
.bottom button{flex:1;height:54px;border-radius:999px;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
#autoBtn{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
#autoBtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#startBtn{background:var(--accent);color:var(--on-accent);border:0}
#startBtn.on{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.err{font-size:14px;color:var(--off);text-align:center;min-height:1.2em;margin-top:8px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="seg" role="group" aria-label="악기">
      <button data-inst="guitar" aria-pressed="true">기타</button>
      <button data-inst="bass" aria-pressed="false">베이스</button>
    </div>
    <div class="ref" aria-label="기준음 A4">
      <button id="refDown" aria-label="기준음 낮추기">−</button>
      <output id="refVal">440Hz</output>
      <button id="refUp" aria-label="기준음 높이기">+</button>
    </div>
  </div>

  <section class="readout" id="readout" data-state="idle" aria-live="polite">
    <div class="note" id="note">E<sub>2</sub></div>
    <svg class="meter" viewBox="0 0 320 200" aria-hidden="true">
      <rect class="card" x=".5" y=".5" width="319" height="199" rx="28"/>
      <g id="dialMarks"></g>
      <text class="side" x="24" y="184">낮음</text>
      <text class="side" x="296" y="184" text-anchor="end">높음</text>
      <g id="needle">
        <line class="needle" x1="160" y1="170" x2="160" y2="40" stroke-width="3"/>
      </g>
      <circle class="hub" cx="160" cy="170" r="10"/>
      <circle class="hubdot" cx="160" cy="170" r="3.5"/>
    </svg>
    <div class="status" id="status">시작을 누르고 줄을 튕기세요</div>
    <div class="hz" id="hz"></div>
  </section>

  <div class="strings" id="strings"></div>

  <div class="bottom">
    <button id="autoBtn" aria-pressed="true">자동 감지</button>
    <button id="startBtn">시작</button>
  </div>
  <div class="err" id="err"></div>
</main>

<script>
const TUNINGS = {
  guitar: { minF: 70, maxF: 400, strings: [
    {n:'E',o:2,m:40,g:5},{n:'A',o:2,m:45,g:4},{n:'D',o:3,m:50,g:4},
    {n:'G',o:3,m:55,g:3},{n:'B',o:3,m:59,g:2},{n:'E',o:4,m:64,g:2}]},
  bass: { minF: 35, maxF: 120, strings: [
    {n:'E',o:1,m:28,g:7},{n:'A',o:1,m:33,g:6},{n:'D',o:2,m:38,g:5},{n:'G',o:2,m:43,g:4}]}
};
const IN_TUNE = 3;      // ±센트
const GATE_RMS = 0.008; // 이하 무음 처리
const HOLD_MS = 900;

const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v = localStorage.getItem('tuner.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('tuner.'+k, JSON.stringify(v)); }catch(e){} }
};

let inst = store.get('inst','guitar');
let a4 = store.get('a4',440);
let auto = true, locked = 0;
let ctx=null, analyser=null, stream=null, buf=null, raf=0, wake=null;
let hist=[], smooth=null, curIdx=-1, lastHeard=0, frame=0;

// 부채꼴 눈금판: ±50센트 = ±60도, 회전축은 판 하단 중앙(160,170)
const PX=160, PY=170, DEG_PER_CENT=1.2;
(function(){
  const NS='http://www.w3.org/2000/svg', g=$('dialMarks');
  const pt=(c,r)=>{ const a=c*DEG_PER_CENT*Math.PI/180; return [PX+r*Math.sin(a), PY-r*Math.cos(a)]; };
  const mk=(tag,attrs,txt)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(txt!==undefined) e.textContent=txt; g.appendChild(e); };
  const R=140;
  const [zx1,zy1]=pt(-IN_TUNE,R+11), [zx2,zy2]=pt(IN_TUNE,R+11);
  mk('path',{class:'zone',d:`M${zx1} ${zy1} A${R+11} ${R+11} 0 0 1 ${zx2} ${zy2}`});
  for(let c=-50;c<=50;c+=5){
    const major=c%10===0, mid=c===0;
    const [x1,y1]=pt(c,R), [x2,y2]=pt(c,R-(mid?20:major?13:7));
    mk('line',{class:mid?'tk mid':'tk',x1,y1,x2,y2,'stroke-width':mid?3:major?2:1.2});
    if(major&&!mid){ const [tx,ty]=pt(c,R-26); mk('text',{class:'lbl',x:tx,y:ty},Math.abs(c)); }
  }
})();

// 바늘: 스프링-댐퍼 관성 (감지 로직과 분리, 목표 센트만 받음)
const needleEl=$('needle');
const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)');
let nPos=0, nVel=0, nTarget=0, nRaf=0, nLast=0;
function renderNeedle(){ needleEl.setAttribute('transform',`rotate(${(nPos*DEG_PER_CENT).toFixed(2)} ${PX} ${PY})`); }
function stepNeedle(t){
  const dt=Math.min(0.05,(t-nLast)/1000||0.016); nLast=t;
  const K=70, C=9.5; // 약한 부족감쇠: 살짝 넘쳤다가 안착
  nVel+=(K*(nTarget-nPos)-C*nVel)*dt;
  nPos+=nVel*dt;
  if(nPos>56){ nPos=56; nVel=-nVel*0.3; } else if(nPos<-56){ nPos=-56; nVel=-nVel*0.3; }
  renderNeedle();
  if(Math.abs(nTarget-nPos)<0.05&&Math.abs(nVel)<0.1){ nPos=nTarget; nVel=0; renderNeedle(); nRaf=0; return; }
  nRaf=requestAnimationFrame(stepNeedle);
}
function setNeedle(c){
  nTarget=Math.max(-50,Math.min(50,c));
  if(reduceMotion.matches){ nPos=nTarget; nVel=0; renderNeedle(); return; }
  if(!nRaf){ nLast=performance.now(); nRaf=requestAnimationFrame(stepNeedle); }
}
renderNeedle();

const freqOf = m => a4 * Math.pow(2,(m-69)/12);

function renderStrings(){
  const box=$('strings'); box.innerHTML='';
  TUNINGS[inst].strings.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='str';
    b.setAttribute('aria-label',`${s.n}${s.o} 줄`);
    b.innerHTML=`${s.n}<small>${s.o}</small>`;
    b.onclick=()=>{ auto=false; locked=i; syncAuto(); setActive(i); };
    box.appendChild(b);
  });
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.inst===inst));
  showNote(TUNINGS[inst].strings[0]);
  setActive(auto?-1:locked);
}
function setActive(i){
  curIdx=i;
  [...$('strings').children].forEach((el,k)=>{
    el.classList.toggle('active',k===i);
    el.classList.toggle('locked',!auto&&k===locked);
  });
}
function syncAuto(){
  $('autoBtn').setAttribute('aria-pressed',auto);
  $('autoBtn').textContent = auto ? '자동 감지' : '수동 (자동으로 전환)';
  setActive(auto?curIdx:locked);
}
function showNote(s){ $('note').innerHTML=`${s.n}<sub>${s.o}</sub>`; }
function setRef(v){
  a4=Math.max(430,Math.min(450,v)); store.set('a4',a4);
  $('refVal').textContent=a4+'Hz';
}

document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  inst=b.dataset.inst; store.set('inst',inst); locked=0; smooth=null; hist=[]; renderStrings();
});
$('refDown').onclick=()=>setRef(a4-1);
$('refUp').onclick=()=>setRef(a4+1);
$('autoBtn').onclick=()=>{ auto=!auto; syncAuto(); };
$('startBtn').onclick=()=> ctx ? stop() : start();

// YIN 음정 감지
function yin(x, sr, minF, maxF){
  const maxTau=Math.min(Math.floor(sr/minF), x.length>>1);
  const minTau=Math.max(2,Math.floor(sr/maxF));
  const W=x.length-maxTau;
  const d=new Float32Array(maxTau+1);
  for(let tau=1;tau<=maxTau;tau++){
    let s=0;
    for(let j=0;j<W;j++){ const v=x[j]-x[j+tau]; s+=v*v; }
    d[tau]=s;
  }
  // 누적 평균 정규화
  let run=0; d[0]=1;
  for(let tau=1;tau<=maxTau;tau++){ run+=d[tau]; d[tau]=run?d[tau]*tau/run:1; }
  let tau=-1;
  for(let t=minTau;t<maxTau;t++){
    if(d[t]<0.15){ while(t+1<maxTau&&d[t+1]<d[t]) t++; tau=t; break; }
  }
  if(tau<0) return -1;
  const a=d[tau-1], b=d[tau], c=d[tau+1];
  const den=a+c-2*b;
  const better = den ? tau + (a-c)/(2*den) : tau;
  return sr/better;
}

function tick(){
  raf=requestAnimationFrame(tick);
  if((frame++)&1) return; // 약 30fps
  analyser.getFloatTimeDomainData(buf);
  let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  const now=performance.now();
  const T=TUNINGS[inst];
  let f=-1;
  if(rms>GATE_RMS) f=yin(buf,ctx.sampleRate,T.minF,T.maxF);
  if(f>0){
    hist.push(f); if(hist.length>5) hist.shift();
    const med=[...hist].sort((p,q)=>p-q)[hist.length>>1];
    let idx=locked;
    if(auto){
      let best=1e9;
      T.strings.forEach((s,i)=>{ const c=Math.abs(1200*Math.log2(med/freqOf(s.m))); if(c<best){best=c;idx=i;} });
    }
    if(idx!==curIdx){ smooth=null; setActive(idx); }
    const s=T.strings[idx];
    const cents=1200*Math.log2(med/freqOf(s.m));
    smooth = smooth===null ? cents : smooth*0.7+cents*0.3;
    lastHeard=now;
    draw(s,smooth,med);
  } else if(now-lastHeard>HOLD_MS){
    idle();
  }
}
function draw(s,c,f){
  showNote(s);
  setNeedle(c);
  const r=Math.round(c);
  const good=Math.abs(c)<=IN_TUNE;
  $('readout').dataset.state = good ? 'good' : (Math.abs(c)<=10 ? 'near' : 'off');
  $('status').textContent = good ? '맞음' : (r<0 ? `${-r}센트 낮음, 조이세요` : `${r}센트 높음, 푸세요`);
  $('hz').textContent = `${f.toFixed(1)}Hz, 목표 ${freqOf(s.m).toFixed(1)}Hz`;
  [...$('strings').children].forEach((el,k)=>el.classList.toggle('ring',k===curIdx));
}
function idle(){
  if($('readout').dataset.state==='idle') return;
  $('readout').dataset.state='idle';
  $('status').textContent='줄을 튕기세요';
  $('hz').textContent='';
  hist=[]; smooth=null; setNeedle(0);
  [...$('strings').children].forEach(el=>el.classList.remove('ring'));
  if(auto) setActive(-1);
}

async function start(){
  $('err').textContent='';
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    $('err').textContent = e && e.name==='NotAllowedError'
      ? '마이크 권한이 꺼져 있습니다. 브라우저 설정에서 이 페이지의 마이크를 허용한 뒤 다시 시작하세요.'
      : '마이크를 열 수 없습니다. 다른 앱이 마이크를 쓰고 있지 않은지 확인하세요.';
    return;
  }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(stream);
  analyser=ctx.createAnalyser(); analyser.fftSize=4096;
  src.connect(analyser);
  buf=new Float32Array(analyser.fftSize);
  try{ wake=await navigator.wakeLock?.request('screen'); }catch(e){}
  $('startBtn').textContent='정지'; $('startBtn').classList.add('on');
  $('status').textContent='줄을 튕기세요';
  tick();
}
function stop(){
  cancelAnimationFrame(raf);
  stream?.getTracks().forEach(t=>t.stop());
  ctx?.close(); ctx=null;
  try{ wake?.release(); }catch(e){} wake=null;
  $('startBtn').textContent='시작'; $('startBtn').classList.remove('on');
  idle(); $('status').textContent='시작을 누르고 줄을 튕기세요';
}

setRef(a4);
renderStrings();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
