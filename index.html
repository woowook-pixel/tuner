<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>튜너</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="튜너">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --field:#111216; --fg:#F4F5F8; --fg2:rgba(244,245,248,.62); --edge:rgba(244,245,248,.22); --tile:rgba(244,245,248,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:#111216}
/* 화면 전체 색이 상태를 말한다: 낮음=파랑, 정확=초록, 높음=주황 */
body{height:100%;margin:0;background:var(--field);color:var(--fg);transition:background-color .35s;
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overflow:hidden}
body[data-state="low"]{--field:#2D55F2}
body[data-state="good"]{--field:#17C47E;--fg:#04170D;--fg2:rgba(4,23,13,.66);--edge:rgba(4,23,13,.3);--tile:rgba(4,23,13,.1)}
body[data-state="high"]{--field:#FF7A3D;--fg:#1D0A02;--fg2:rgba(29,10,2,.66);--edge:rgba(29,10,2,.3);--tile:rgba(29,10,2,.1)}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:16px 20px 20px}

/* 상단 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.seg{display:flex;gap:18px}
.seg button{border:0;background:transparent;color:var(--fg2);font:inherit;font-weight:700;font-size:16px;
  padding:6px 0;cursor:pointer;border-bottom:3px solid transparent}
.seg button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.ref{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--fg2)}
.ref button{width:36px;height:36px;border-radius:12px;border:0;background:var(--tile);color:var(--fg);font-size:18px;cursor:pointer}
.ref output{min-width:64px;text-align:center;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}

/* 중앙: 거대한 음이름 + 흐르는 눈금 테이프 */
.readout{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0;text-align:center}
.note{font-weight:800;font-size:clamp(150px,50vw,240px);line-height:.82;letter-spacing:-.06em;margin-left:-.04em;
  opacity:1;transition:opacity .3s}
.note sub{font-size:.2em;font-weight:700;color:var(--fg2);vertical-align:baseline;margin-left:6px;letter-spacing:0}
.readout[data-state="idle"] .note{opacity:.18}
.status{margin-top:22px;font-size:20px;font-weight:700;min-height:1.4em}
.tape{position:relative;width:calc(100% + 40px);height:96px;margin:18px -20px 6px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.strip{position:absolute;left:50%;top:0;bottom:0;width:0;will-change:transform}
.strip i{position:absolute;top:50%;width:2px;margin-left:-1px;height:22px;margin-top:-11px;background:var(--fg);opacity:.4;border-radius:1px}
.strip i.ten{height:38px;margin-top:-19px;opacity:.75}
.strip b{position:absolute;top:calc(50% + 28px);transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--fg2);font-variant-numeric:tabular-nums}
.pin{position:absolute;left:50%;top:6px;bottom:6px;width:4px;margin-left:-2px;background:var(--fg);border-radius:2px}
.hz{font-size:14px;color:var(--fg2);min-height:1.3em;font-variant-numeric:tabular-nums}

/* 줄 */
.strings{display:flex;gap:8px;margin:14px 0 8px}
.str{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:64px;
  background:var(--tile);border:0;border-radius:14px;
  padding:0;cursor:pointer;color:var(--fg);font:inherit;font-weight:800;font-size:22px}
.str small{font-size:11px;font-weight:700;color:var(--fg2)}
.str.active{box-shadow:inset 0 0 0 2px var(--fg)}
.str.locked{background:var(--fg);color:var(--field)}
.str.locked small{color:var(--field);opacity:.7}
.str.ring{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.str.ring{animation:none}body{transition:none}}

.bottom{display:flex;gap:10px;margin-top:10px}
.bottom button{height:58px;border-radius:16px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;border:0}
#autoBtn{flex:0 0 36%;background:var(--tile);color:var(--fg)}
#autoBtn[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fg)}
#startBtn{flex:1;background:var(--fg);color:var(--field)}
#startBtn.on{background:var(--tile);color:var(--fg)}
.err{font-size:14px;font-weight:600;text-align:center;min-height:1.2em;margin-top:8px}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="seg" role="group" aria-label="악기">
      <button data-inst="guitar" aria-pressed="true">기타</button>
      <button data-inst="bass" aria-pressed="false">베이스</button>
    </div>
    <div class="ref" aria-label="기준음 A4">
      <button id="refDown" aria-label="기준음 낮추기">−</button>
      <output id="refVal">440Hz</output>
      <button id="refUp" aria-label="기준음 높이기">+</button>
    </div>
  </div>

  <section class="readout" id="readout" data-state="idle" aria-live="polite">
    <div class="note" id="note">E<sub>2</sub></div>
    <div class="status" id="status">시작을 누르고 줄을 튕기세요</div>
    <div class="tape" aria-hidden="true"><div class="strip" id="strip"></div><div class="pin"></div></div>
    <div class="hz" id="hz"></div>
  </section>

  <div class="strings" id="strings"></div>

  <div class="bottom">
    <button id="autoBtn" aria-pressed="true">자동 감지</button>
    <button id="startBtn">시작</button>
  </div>
  <div class="err" id="err"></div>
</main>

<script>
const TUNINGS = {
  guitar: { minF: 70, maxF: 400, strings: [
    {n:'E',o:2,m:40,g:5},{n:'A',o:2,m:45,g:4},{n:'D',o:3,m:50,g:4},
    {n:'G',o:3,m:55,g:3},{n:'B',o:3,m:59,g:2},{n:'E',o:4,m:64,g:2}]},
  bass: { minF: 35, maxF: 120, strings: [
    {n:'E',o:1,m:28,g:7},{n:'A',o:1,m:33,g:6},{n:'D',o:2,m:38,g:5},{n:'G',o:2,m:43,g:4}]}
};
const IN_TUNE = 3;      // ±센트
const GATE_RMS = 0.008; // 이하 무음 처리
const HOLD_MS = 900;

const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v = localStorage.getItem('tuner.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('tuner.'+k, JSON.stringify(v)); }catch(e){} }
};

let inst = store.get('inst','guitar');
let a4 = store.get('a4',440);
let auto = true, locked = 0;
let ctx=null, analyser=null, stream=null, buf=null, raf=0, wake=null;
let hist=[], smooth=null, curIdx=-1, lastHeard=0, frame=0;

// 흐르는 눈금 테이프: 바늘 대신 눈금이 고정 핀 아래로 이동, ±50센트
const PXC=4.5;
(function(){
  const t=$('strip');
  for(let c=-65;c<=65;c+=5){
    const i=document.createElement('i'); i.style.left=(c*PXC)+'px';
    if(c%10===0) i.className='ten';
    t.appendChild(i);
    if(c%10===0&&Math.abs(c)<=50){ const b=document.createElement('b'); b.style.left=(c*PXC)+'px'; b.textContent=c>0?'+'+c:c; t.appendChild(b); }
  }
})();

// 관성: 스프링-댐퍼 (감지 로직과 분리, 목표 센트만 받음)
const stripEl=$('strip');
const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)');
let nPos=0, nVel=0, nTarget=0, nRaf=0, nLast=0;
function renderNeedle(){ stripEl.style.transform=`translateX(${(-nPos*PXC).toFixed(1)}px)`; }
function stepNeedle(t){
  const dt=Math.min(0.05,(t-nLast)/1000||0.016); nLast=t;
  const K=70, C=9.5; // 약한 부족감쇠: 살짝 넘쳤다가 안착
  nVel+=(K*(nTarget-nPos)-C*nVel)*dt;
  nPos+=nVel*dt;
  if(nPos>56){ nPos=56; nVel=-nVel*0.3; } else if(nPos<-56){ nPos=-56; nVel=-nVel*0.3; }
  renderNeedle();
  if(Math.abs(nTarget-nPos)<0.05&&Math.abs(nVel)<0.1){ nPos=nTarget; nVel=0; renderNeedle(); nRaf=0; return; }
  nRaf=requestAnimationFrame(stepNeedle);
}
function setNeedle(c){
  nTarget=Math.max(-50,Math.min(50,c));
  if(reduceMotion.matches){ nPos=nTarget; nVel=0; renderNeedle(); return; }
  if(!nRaf){ nLast=performance.now(); nRaf=requestAnimationFrame(stepNeedle); }
}
renderNeedle();

const freqOf = m => a4 * Math.pow(2,(m-69)/12);

function renderStrings(){
  const box=$('strings'); box.innerHTML='';
  TUNINGS[inst].strings.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='str';
    b.setAttribute('aria-label',`${s.n}${s.o} 줄`);
    b.innerHTML=`${s.n}<small>${s.o}</small>`;
    b.onclick=()=>{ auto=false; locked=i; syncAuto(); setActive(i); };
    box.appendChild(b);
  });
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.inst===inst));
  showNote(TUNINGS[inst].strings[0]);
  setActive(auto?-1:locked);
}
function setActive(i){
  curIdx=i;
  [...$('strings').children].forEach((el,k)=>{
    el.classList.toggle('active',k===i);
    el.classList.toggle('locked',!auto&&k===locked);
  });
}
function syncAuto(){
  $('autoBtn').setAttribute('aria-pressed',auto);
  $('autoBtn').textContent = auto ? '자동 감지' : '수동 (자동으로 전환)';
  setActive(auto?curIdx:locked);
}
function showNote(s){ $('note').innerHTML=`${s.n}<sub>${s.o}</sub>`; }
function setRef(v){
  a4=Math.max(430,Math.min(450,v)); store.set('a4',a4);
  $('refVal').textContent=a4+'Hz';
}

document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  inst=b.dataset.inst; store.set('inst',inst); locked=0; smooth=null; hist=[]; renderStrings();
});
$('refDown').onclick=()=>setRef(a4-1);
$('refUp').onclick=()=>setRef(a4+1);
$('autoBtn').onclick=()=>{ auto=!auto; syncAuto(); };
$('startBtn').onclick=()=> ctx ? stop() : start();

// YIN 음정 감지
function yin(x, sr, minF, maxF){
  const maxTau=Math.min(Math.floor(sr/minF), x.length>>1);
  const minTau=Math.max(2,Math.floor(sr/maxF));
  const W=x.length-maxTau;
  const d=new Float32Array(maxTau+1);
  for(let tau=1;tau<=maxTau;tau++){
    let s=0;
    for(let j=0;j<W;j++){ const v=x[j]-x[j+tau]; s+=v*v; }
    d[tau]=s;
  }
  // 누적 평균 정규화
  let run=0; d[0]=1;
  for(let tau=1;tau<=maxTau;tau++){ run+=d[tau]; d[tau]=run?d[tau]*tau/run:1; }
  let tau=-1;
  for(let t=minTau;t<maxTau;t++){
    if(d[t]<0.15){ while(t+1<maxTau&&d[t+1]<d[t]) t++; tau=t; break; }
  }
  if(tau<0) return -1;
  const a=d[tau-1], b=d[tau], c=d[tau+1];
  const den=a+c-2*b;
  const better = den ? tau + (a-c)/(2*den) : tau;
  return sr/better;
}

function tick(){
  raf=requestAnimationFrame(tick);
  if((frame++)&1) return; // 약 30fps
  analyser.getFloatTimeDomainData(buf);
  let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  const now=performance.now();
  const T=TUNINGS[inst];
  let f=-1;
  if(rms>GATE_RMS) f=yin(buf,ctx.sampleRate,T.minF,T.maxF);
  if(f>0){
    hist.push(f); if(hist.length>5) hist.shift();
    const med=[...hist].sort((p,q)=>p-q)[hist.length>>1];
    let idx=locked;
    if(auto){
      let best=1e9;
      T.strings.forEach((s,i)=>{ const c=Math.abs(1200*Math.log2(med/freqOf(s.m))); if(c<best){best=c;idx=i;} });
    }
    if(idx!==curIdx){ smooth=null; setActive(idx); }
    const s=T.strings[idx];
    const cents=1200*Math.log2(med/freqOf(s.m));
    smooth = smooth===null ? cents : smooth*0.7+cents*0.3;
    lastHeard=now;
    draw(s,smooth,med);
  } else if(now-lastHeard>HOLD_MS){
    idle();
  }
}
function draw(s,c,f){
  showNote(s);
  setNeedle(c);
  const r=Math.round(c);
  const good=Math.abs(c)<=IN_TUNE;
  $('readout').dataset.state = good ? 'good' : (Math.abs(c)<=10 ? 'near' : 'off');
  document.body.dataset.state = good ? 'good' : (c<0 ? 'low' : 'high');
  $('status').textContent = good ? '맞음' : (r<0 ? `${-r}센트 낮음, 조이세요` : `${r}센트 높음, 푸세요`);
  $('hz').textContent = `${f.toFixed(1)}Hz, 목표 ${freqOf(s.m).toFixed(1)}Hz`;
  [...$('strings').children].forEach((el,k)=>el.classList.toggle('ring',k===curIdx));
}
function idle(){
  if($('readout').dataset.state==='idle') return;
  $('readout').dataset.state='idle'; document.body.dataset.state='idle';
  $('status').textContent='줄을 튕기세요';
  $('hz').textContent='';
  hist=[]; smooth=null; setNeedle(0);
  [...$('strings').children].forEach(el=>el.classList.remove('ring'));
  if(auto) setActive(-1);
}

async function start(){
  $('err').textContent='';
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    $('err').textContent = e && e.name==='NotAllowedError'
      ? '마이크 권한이 꺼져 있습니다. 브라우저 설정에서 이 페이지의 마이크를 허용한 뒤 다시 시작하세요.'
      : '마이크를 열 수 없습니다. 다른 앱이 마이크를 쓰고 있지 않은지 확인하세요.';
    return;
  }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(stream);
  analyser=ctx.createAnalyser(); analyser.fftSize=4096;
  src.connect(analyser);
  buf=new Float32Array(analyser.fftSize);
  try{ wake=await navigator.wakeLock?.request('screen'); }catch(e){}
  $('startBtn').textContent='정지'; $('startBtn').classList.add('on');
  $('status').textContent='줄을 튕기세요';
  tick();
}
function stop(){
  cancelAnimationFrame(raf);
  stream?.getTracks().forEach(t=>t.stop());
  ctx?.close(); ctx=null;
  try{ wake?.release(); }catch(e){} wake=null;
  $('startBtn').textContent='시작'; $('startBtn').classList.remove('on');
  idle(); $('status').textContent='시작을 누르고 줄을 튕기세요';
}

setRef(a4);
renderStrings();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
