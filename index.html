<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/design/shared/icons/pitch.svg">
<!-- apple-touch-icon: scripts/build.js가 빌드 때 design/shared/icons/apple-touch-icon.datauri.txt의 data 주소를 넣는다 -->
<link rel="apple-touch-icon" sizes="180x180" href="__APPLE_TOUCH_ICON__">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pitch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/design/shared/tokens.css">
<script src="/design/shared/symbols.js" defer></script>
<style>
/* Pitch: 공통 토큰(design/shared/tokens.css) 위에 얹는 화면 전용 스타일 */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--pf-white)}
body{-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border-radius:0;cursor:pointer}
.app{max-width:480px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;
  padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}

/* 제목 블록: 보조 라벨 + 음 이름 */
/* 음 이름 블록: 제목 줄이 아니라 큰 글자라서 공통 .pf-titleblock(제목 왼쪽, 보조 라벨 오른쪽, CHANGELOG 009)을 쓰지 않고 기존 모양을 유지한다 */
.noteblock{display:flex;flex-direction:column;gap:10px;padding:24px 0 6px}
.note{font:900 150px/.9 var(--pf-font);letter-spacing:-.04em;color:#D6D6D6;margin-left:-.04em;transition:color .15s}
.note .oct{font:900 48px/1 var(--pf-font);letter-spacing:0;color:var(--pf-black);margin-left:6px}
.readout[data-state="good"] .note{color:var(--pf-black)}
.guide{margin-top:18px;font:800 22px/1.2 var(--pf-font);min-height:1.2em}
.sub{margin-top:6px;font:var(--pf-sub);color:var(--pf-gray);min-height:1.4em;font-variant-numeric:tabular-nums}

/* 음정 막대: 검은 기준선, 5% 간격 눈금, 현재 음정은 Ember 세로 막대 */
.meter{position:relative;height:92px;margin-top:14px}
.meter .ember{position:absolute;top:0;height:44px;width:9px;margin-left:-4.5px;left:50%;background:var(--pf-ember);transition:opacity .2s}
.readout[data-state="idle"] .meter .ember{opacity:0}
.meter .base{position:absolute;left:0;right:0;top:44px;height:1px;background:var(--pf-black)}
.meter .tick{position:absolute;top:45px;width:1px;height:7px;background:var(--pf-mute)}
.meter .tick.mid{height:15px;background:var(--pf-black)}
.meter .lab{position:absolute;top:66px;font:500 12px/1 var(--pf-font);color:var(--pf-gray)}
.meter .lab.c{left:50%;transform:translateX(-50%)}
.readout[data-state="good"] .meter .lab.c{font-weight:800;color:var(--pf-black)}

/* 줄 선택 탭 */
.pf-tab.hit{font-weight:800;color:var(--pf-black)}
.hint{margin-top:8px;font:var(--pf-sub);color:var(--pf-gray);min-height:1.4em}

#startBtn{display:none;margin-top:20px}
body[data-run="0"] #startBtn{display:block}
.err{font:700 13px/1.4 var(--pf-font);margin-top:10px;min-height:1.4em}

/* 설정 시트: 상단 직선 + 검정 2px 선, 뒤 배경은 --pf-dim */
.scrim{position:fixed;inset:0;background:var(--pf-dim);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:480px;max-height:100vh;overflow:auto;padding-bottom:calc(34px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;min-height:var(--pf-touch)}
.sheet-head h2{font:var(--pf-heading);letter-spacing:-.02em;margin:0}
.inst{width:100%;border:0;background:none;text-align:left}
.inst .nm{font:800 16px/1.2 var(--pf-font)}
.inst .box{width:10px;height:10px;margin-left:auto;box-shadow:inset 0 0 0 1px var(--pf-black)}
.inst[aria-pressed="true"] .box{background:var(--pf-black)}
.refline{display:flex;align-items:center;justify-content:space-between;min-height:var(--pf-row)}
.refline .pf-action{font-size:22px;font-weight:700;letter-spacing:0}
.refline output{font:900 34px/1 var(--pf-font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.refnote{margin:8px 0 0;font:400 13px/1.5 var(--pf-font);color:var(--pf-gray)}
.sheet .pf-btn-primary{margin-top:28px}
button:focus-visible{outline:2px solid var(--pf-black);outline-offset:2px}
</style>
</head>
<body data-run="0">
<main class="pf-screen app readout" id="readout" data-state="idle">
  <header class="pf-header">
    <div class="pf-topbar">
      <span class="pf-brand">
        <span class="pf-wordmark">Pitch</span>
        <picture>
          <source srcset="/design/shared/characters/pitch-still.png" media="(prefers-reduced-motion: reduce)">
          <img class="pf-brand-character" src="/design/shared/characters/pitch.gif" alt="" width="44" height="28">
        </picture>
      </span>
      <div class="pf-actions">
        <button class="pf-action" id="runBtn"><pf-sym name="play"></pf-sym>시작</button>
        <button class="pf-action" id="gearBtn"><pf-sym name="settings"></pf-sym>설정</button>
      </div>
    </div>
  </header>

  <div class="noteblock">
    <div class="pf-eyebrow" id="eyebrow"></div>
    <div class="note" id="note">E<span class="oct">2</span></div>
  </div>
  <div class="guide" id="status" aria-live="polite">줄을 튕기십시오</div>
  <div class="sub" id="hz"></div>
  <div class="meter" aria-hidden="true" id="meter">
    <div class="base"></div>
    <div class="ember" id="ember"></div>
    <span class="lab" style="left:0">낮음</span><span class="lab c">정확</span><span class="lab" style="right:0">높음</span>
  </div>

  <div class="pf-label"><span>줄 선택</span></div>
  <div class="pf-tabs" id="tabs" role="tablist" aria-label="줄 선택"></div>
  <div class="hint" id="hint"></div>

  <button class="pf-btn-primary" id="startBtn"><pf-sym name="mic"></pf-sym>마이크 켜고 시작</button>
  <div class="err" id="err"></div>
</main>

<div class="pf-update pf-no-tabbar" id="update" role="status" hidden>
  <span class="pf-update-text">새 버전이 있습니다</span>
  <button type="button" class="pf-update-later" id="updateLater">나중에</button>
  <button type="button" class="pf-update-reload" id="updateReload"><pf-sym name="refresh"></pf-sym>새로고침</button>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="pf-sheet sheet" role="dialog" aria-modal="true" aria-label="설정">
    <div class="sheet-head">
      <h2>설정</h2>
      <button class="pf-action" id="closeBtn"><pf-sym name="close"></pf-sym>닫기</button>
    </div>
    <div class="pf-label"><span>악기 선택</span></div>
    <div class="pf-list">
      <button class="pf-row inst" data-inst="guitar" aria-pressed="true"><span class="nm">기타</span><span class="pf-row-sub">6현 · E A D G B E</span><i class="box"></i></button>
      <button class="pf-row inst" data-inst="bass" aria-pressed="false"><span class="nm">베이스</span><span class="pf-row-sub">4현 · E A D G</span><i class="box"></i></button>
    </div>
    <div class="pf-label"><span>기준음 (A4)</span></div>
    <div class="refline">
      <button class="pf-action" id="refDown" aria-label="기준음 낮추기">−</button>
      <output id="refVal">440Hz</output>
      <button class="pf-action" id="refUp" aria-label="기준음 높이기"><pf-sym name="plus"></pf-sym></button>
    </div>
    <p class="refnote">피아노 등 다른 악기와 음높이를 맞출 때만 바꿉니다. 보통은 440Hz 그대로 두면 됩니다.</p>
    <button class="pf-btn-primary" id="doneBtn">완료</button>
  </div>
</div>

<script>
const TUNINGS = {
  guitar: { minF: 70, maxF: 400, strings: [
    {n:'E',o:2,m:40,g:5},{n:'A',o:2,m:45,g:4},{n:'D',o:3,m:50,g:4},
    {n:'G',o:3,m:55,g:3},{n:'B',o:3,m:59,g:2},{n:'E',o:4,m:64,g:2}]},
  bass: { minF: 35, maxF: 120, strings: [
    {n:'E',o:1,m:28,g:7},{n:'A',o:1,m:33,g:6},{n:'D',o:2,m:38,g:5},{n:'G',o:2,m:43,g:4}]}
};
const INST_NAME = { guitar:'기타', bass:'베이스' };
const IN_TUNE = 3;      // ±센트
const GATE_RMS = 0.008; // 이하 무음 처리
const HOLD_MS = 900;

const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v = localStorage.getItem('tuner.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('tuner.'+k, JSON.stringify(v)); }catch(e){} }
};

let inst = store.get('inst','guitar');
let a4 = store.get('a4',440);
let auto = true, locked = 0;
let ctx=null, analyser=null, stream=null, buf=null, raf=0, wake=null;
let hist=[], smooth=null, curIdx=-1, lastHeard=0, frame=0;
let autoTab=null, tabEls=[];

// 음정 막대: 5% 간격 눈금(±50센트를 0-100%로 매핑, 중앙은 길게)
(function(){
  const m=$('meter');
  for(let i=0;i<=20;i++){
    const t=document.createElement('i'); t.className='tick'+(i===10?' mid':'');
    t.style.left=(i*5)+'%'; m.appendChild(t);
  }
})();

// 막대의 Ember 표시: 스프링-댐퍼 관성 (감지 로직과 분리, 목표 센트만 받음)
const emberEl=$('ember');
const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)');
let nPos=0, nVel=0, nTarget=0, nRaf=0, nLast=0;
function renderNeedle(){ emberEl.style.left=(50+Math.max(-50,Math.min(50,nPos))).toFixed(2)+'%'; }
function stepNeedle(t){
  const dt=Math.min(0.05,(t-nLast)/1000||0.016); nLast=t;
  const K=70, C=9.5; // 약한 부족감쇠: 살짝 넘쳤다가 안착
  nVel+=(K*(nTarget-nPos)-C*nVel)*dt;
  nPos+=nVel*dt;
  if(nPos>56){ nPos=56; nVel=-nVel*0.3; } else if(nPos<-56){ nPos=-56; nVel=-nVel*0.3; }
  renderNeedle();
  if(Math.abs(nTarget-nPos)<0.05&&Math.abs(nVel)<0.1){ nPos=nTarget; nVel=0; renderNeedle(); nRaf=0; return; }
  nRaf=requestAnimationFrame(stepNeedle);
}
function setNeedle(c){
  nTarget=Math.max(-50,Math.min(50,c));
  if(reduceMotion.matches){ nPos=nTarget; nVel=0; renderNeedle(); return; }
  if(!nRaf){ nLast=performance.now(); nRaf=requestAnimationFrame(stepNeedle); }
}
renderNeedle();

const freqOf = m => a4 * Math.pow(2,(m-69)/12);

// 줄 선택 탭: 자동 + 각 줄 (줄을 고르면 그 줄로 고정, 같은 탭을 다시 누르면 자동으로 복귀)
function renderStrings(){
  const box=$('tabs'); box.textContent=''; tabEls=[];
  const list=TUNINGS[inst].strings;
  const mk=(label,onclick)=>{
    const b=document.createElement('button');
    b.className='pf-tab'; b.setAttribute('role','tab'); b.textContent=label; b.onclick=onclick;
    box.appendChild(b); return b;
  };
  autoTab=mk('자동',()=>{ if(!auto){ auto=true; syncAuto(); setActive(-1); } });
  autoTab.setAttribute('aria-label','자동 감지');
  list.forEach((s,i)=>{
    const t=mk(`${s.n}${s.o}`,()=>{
      if(!auto&&locked===i){ auto=true; syncAuto(); setActive(-1); return; }
      auto=false; locked=i; showNote(s); syncAuto(); setActive(i);
    });
    t.setAttribute('aria-label',`${s.n}${s.o} 줄`);
    tabEls[i]=t;
  });
  document.querySelectorAll('.inst').forEach(x=>x.setAttribute('aria-pressed',x.dataset.inst===inst));
  showNote(list[0]);
  syncAuto();
  setActive(auto?-1:locked);
}
function refreshTabs(){
  if(!autoTab) return;
  autoTab.setAttribute('aria-selected',auto);
  tabEls.forEach((el,k)=>{
    el.setAttribute('aria-selected',!auto&&k===locked);
    el.classList.toggle('hit',auto&&k===curIdx);
  });
}
function setActive(i){ curIdx=i; refreshTabs(); }
function renderEyebrow(){
  const s=TUNINGS[inst].strings[locked];
  const live=auto&&document.body.dataset.run==='1';
  $('eyebrow').innerHTML=`<span class="${live?'pf-now':''}">${auto?'자동 감지':`${s.n}${s.o} 고정`}</span><span aria-hidden="true">·</span><span>${INST_NAME[inst]}</span>`;
}
function syncAuto(){
  $('hint').textContent = auto ? '줄을 탭하면 그 줄로 고정됩니다' : '고정한 줄을 다시 탭하거나 자동을 탭하면 자동 감지로 돌아갑니다';
  renderEyebrow();
  setActive(auto?curIdx:locked);
}
function showNote(s){ $('note').innerHTML=`${s.n}<span class="oct">${s.o}</span>`; }
function setRef(v){
  a4=Math.max(430,Math.min(450,v)); store.set('a4',a4);
  $('refVal').textContent=a4+'Hz';
}
function syncRun(){
  const on=document.body.dataset.run==='1';
  $('runBtn').innerHTML = on ? '<pf-sym name="stop"></pf-sym>정지' : '<pf-sym name="play"></pf-sym>시작';
  renderEyebrow();
}

document.querySelectorAll('.inst').forEach(b=>b.onclick=()=>{
  inst=b.dataset.inst; store.set('inst',inst); locked=0; smooth=null; hist=[]; auto=true; renderStrings();
});
$('refDown').onclick=()=>setRef(a4-1);
$('refUp').onclick=()=>setRef(a4+1);
$('startBtn').onclick=start;
$('runBtn').onclick=()=> ctx ? stop() : start();
const sheet=$('scrim');
const openSheet=()=>{ sheet.hidden=false; $('closeBtn').focus(); };
const closeSheet=()=>{ sheet.hidden=true; $('gearBtn').focus(); };
$('gearBtn').onclick=openSheet;
$('doneBtn').onclick=closeSheet;
$('closeBtn').onclick=closeSheet;
sheet.addEventListener('click',e=>{ if(e.target===sheet) closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!sheet.hidden) closeSheet(); });

// YIN 음정 감지
function yin(x, sr, minF, maxF){
  const maxTau=Math.min(Math.floor(sr/minF), x.length>>1);
  const minTau=Math.max(2,Math.floor(sr/maxF));
  const W=x.length-maxTau;
  const d=new Float32Array(maxTau+1);
  for(let tau=1;tau<=maxTau;tau++){
    let s=0;
    for(let j=0;j<W;j++){ const v=x[j]-x[j+tau]; s+=v*v; }
    d[tau]=s;
  }
  // 누적 평균 정규화
  let run=0; d[0]=1;
  for(let tau=1;tau<=maxTau;tau++){ run+=d[tau]; d[tau]=run?d[tau]*tau/run:1; }
  let tau=-1;
  for(let t=minTau;t<maxTau;t++){
    if(d[t]<0.15){ while(t+1<maxTau&&d[t+1]<d[t]) t++; tau=t; break; }
  }
  if(tau<0) return -1;
  const a=d[tau-1], b=d[tau], c=d[tau+1];
  const den=a+c-2*b;
  const better = den ? tau + (a-c)/(2*den) : tau;
  return sr/better;
}

function tick(){
  raf=requestAnimationFrame(tick);
  if((frame++)&1) return; // 약 30fps
  analyser.getFloatTimeDomainData(buf);
  let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  const now=performance.now();
  const T=TUNINGS[inst];
  let f=-1;
  if(rms>GATE_RMS) f=yin(buf,ctx.sampleRate,T.minF,T.maxF);
  if(f>0){
    hist.push(f); if(hist.length>5) hist.shift();
    const med=[...hist].sort((p,q)=>p-q)[hist.length>>1];
    let idx=locked;
    if(auto){
      let best=1e9;
      T.strings.forEach((s,i)=>{ const c=Math.abs(1200*Math.log2(med/freqOf(s.m))); if(c<best){best=c;idx=i;} });
    }
    if(idx!==curIdx){ smooth=null; setActive(idx); }
    const s=T.strings[idx];
    const cents=1200*Math.log2(med/freqOf(s.m));
    smooth = smooth===null ? cents : smooth*0.7+cents*0.3;
    lastHeard=now;
    draw(s,smooth,med);
  } else if(now-lastHeard>HOLD_MS){
    idle();
  }
}
function draw(s,c,f){
  showNote(s);
  setNeedle(c);
  const r=Math.round(c);
  const good=Math.abs(c)<=IN_TUNE;
  const near=Math.abs(c)<=10; // 10센트 이내는 "조금"
  $('readout').dataset.state = good ? 'good' : (near ? 'near' : 'off');
  $('status').textContent = good ? '정확' : (r<0 ? `${near?'조금 ':''}낮음` : `${near?'조금 ':''}높음`);
  $('hz').textContent = `${good?'':(r>0?'+':'−')+Math.abs(r)+'센트 · '}${f.toFixed(1)}Hz, 목표 ${freqOf(s.m).toFixed(1)}Hz`;
}
function idle(){
  if($('readout').dataset.state==='idle') return;
  $('readout').dataset.state='idle';
  $('status').textContent='줄을 튕기십시오';
  $('hz').textContent='';
  hist=[]; smooth=null; setNeedle(0);
  if(auto) setActive(-1);
}

async function start(){
  $('err').textContent='';
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    $('err').textContent = e && e.name==='NotAllowedError'
      ? '마이크 권한이 꺼져 있습니다. 브라우저 설정에서 이 페이지의 마이크를 허용한 뒤 다시 시작하십시오.'
      : '마이크를 열 수 없습니다. 다른 앱이 마이크를 쓰고 있지 않은지 확인하십시오.';
    return;
  }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  if (ctx.state === 'suspended') await ctx.resume();
  const src=ctx.createMediaStreamSource(stream);
  analyser=ctx.createAnalyser(); analyser.fftSize=4096;
  src.connect(analyser);
  buf=new Float32Array(analyser.fftSize);
  try{ wake=await navigator.wakeLock?.request('screen'); }catch(e){}
  document.body.dataset.run='1'; syncRun();
  $('status').textContent='줄을 튕기십시오';
  tick();
}
function stop(){
  cancelAnimationFrame(raf);
  stream?.getTracks().forEach(t=>t.stop());
  ctx?.close(); ctx=null;
  try{ wake?.release(); }catch(e){} wake=null;
  document.body.dataset.run='0'; syncRun();
  idle();
}

// 새 버전 알림: /version.json과 이 파일에 들어 있는 APP_VERSION을 비교한다.
const APP_VERSION = '__APP_VERSION__'; // 배포 빌드에서 scripts/write-version.js가 커밋 SHA로 바꾼다
(function(){
  const bar=$('update');
  const KEY='pitch.updateLater';
  let later=''; try{ later=sessionStorage.getItem(KEY)||''; }catch(e){}
  let latest='';
  async function check(){
    if(APP_VERSION.startsWith('__')) return; // 빌드에서 값이 주입되지 않은 환경(로컬 등)은 비교하지 않는다
    try{
      const r=await fetch('/version.json',{cache:'no-store'});
      if(!r.ok) return;
      const v=(await r.json()).version;
      if(typeof v!=='string'||!v) return;
      latest=v;
      bar.hidden=!(v!==APP_VERSION&&v!==later);
    }catch(e){ /* 오프라인이거나 받지 못하면 아무것도 띄우지 않는다 */ }
  }
  $('updateLater').onclick=()=>{
    later=latest; bar.hidden=true;
    try{ sessionStorage.setItem(KEY,later); }catch(e){}
  };
  $('updateReload').onclick=async()=>{
    try{
      const reg='serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
      if(reg){
        await reg.update();
        if(reg.waiting) reg.waiting.postMessage('skipWaiting');
        const w=reg.installing||reg.waiting;
        if(w&&w.state!=='activated'){
          await new Promise(res=>{
            w.addEventListener('statechange',()=>{ if(w.state==='activated'||w.state==='redundant') res(); });
            setTimeout(res,3000);
          });
        }
      }
    }catch(e){}
    location.reload();
  };
  check();                                                        // 앱이 열릴 때
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); }); // 앱으로 돌아올 때
  setInterval(check,5*60*1000);                                   // 5분마다
})();

setRef(a4);
renderStrings();
syncRun();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
