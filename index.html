<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>튜너</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="튜너">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F6F4EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF; --ink:#1B1D22; --muted:#767B87; --line:#C9CCD4; --tile:#ECE9E1;
  --amber:#E08A00; --on-amber:#1A1208; --good:#0F9F63; --off:#D9482B;
  --sc:var(--amber);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overflow:hidden}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:16px 20px 20px}

/* 상단 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.seg{display:flex;gap:18px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:16px;
  padding:6px 0;cursor:pointer;border-bottom:3px solid transparent}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.ref{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted)}
.ref button{width:36px;height:36px;border-radius:12px;border:0;background:var(--tile);color:var(--ink);font-size:18px;cursor:pointer}
.ref output{min-width:64px;text-align:center;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* 중앙: 머리말 + 줄 */
.readout{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:18px}
.readout[data-state="good"]{--sc:var(--good)}
.head{display:flex;align-items:flex-end;gap:16px;min-height:84px}
.note{font-weight:800;font-size:76px;line-height:.9;letter-spacing:-.04em;transition:color .2s}
.note sub{font-size:.3em;font-weight:700;color:var(--muted);vertical-align:baseline;margin-left:3px;letter-spacing:0}
.readout[data-state="good"] .note{color:var(--good)}
.readout[data-state="idle"] .note{color:var(--line)}
.msg{padding-bottom:4px;min-width:0}
.status{font-size:17px;font-weight:700;min-height:1.4em}
.readout[data-state="good"] .status{color:var(--good)}
.readout:not([data-state="good"]):not([data-state="idle"]) .status{color:var(--amber)}
.hz{font-size:13px;color:var(--muted);min-height:1.3em;font-variant-numeric:tabular-nums}

.lanes{flex:1;min-height:0;width:100%;display:block;margin-top:8px}
.ln{stroke:var(--line);stroke-linecap:round}
.str{cursor:pointer;outline:none}
.str .hit{fill:transparent}
.str .peg{fill:var(--bg);stroke:var(--line);stroke-width:2;transition:fill .15s,stroke .15s}
.str text{fill:var(--muted);font:700 20px "IBM Plex Sans KR",system-ui,sans-serif;text-anchor:middle;pointer-events:none}
.str .oct{font-size:10px;font-weight:600}
.str.active .peg{fill:var(--sc);stroke:var(--sc)}
.str.active text{fill:var(--on-amber)}
.str.locked .peg{fill:var(--ink);stroke:var(--ink)}
.str.locked text{fill:var(--bg)}
.str:focus-visible .peg{stroke:var(--ink);stroke-width:3}
.bent{fill:none;stroke:var(--sc);stroke-width:5;stroke-linecap:round;transition:stroke .2s}
.readout[data-state="idle"] .bent{opacity:0}
.str.ring .peg{animation:pulse .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.str.ring .peg{animation:none}}

.bottom{display:flex;gap:10px;margin-top:10px}
.bottom button{height:58px;border-radius:999px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;border:0}
#autoBtn{flex:0 0 36%;background:var(--tile);color:var(--ink)}
#autoBtn[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
#startBtn{flex:1;background:var(--amber);color:var(--on-amber)}
#startBtn.on{background:var(--ink);color:var(--bg)}
.err{font-size:14px;font-weight:600;text-align:center;min-height:1.2em;margin-top:8px;color:var(--off)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="seg" role="group" aria-label="악기">
      <button data-inst="guitar" aria-pressed="true">기타</button>
      <button data-inst="bass" aria-pressed="false">베이스</button>
    </div>
    <div class="ref" aria-label="기준음 A4">
      <button id="refDown" aria-label="기준음 낮추기">−</button>
      <output id="refVal">440Hz</output>
      <button id="refUp" aria-label="기준음 높이기">+</button>
    </div>
  </div>

  <section class="readout" id="readout" data-state="idle">
    <div class="head">
      <div class="note" id="note">E<sub>2</sub></div>
      <div class="msg" aria-live="polite">
        <div class="status" id="status">시작을 누르고 줄을 튕기세요</div>
        <div class="hz" id="hz"></div>
      </div>
    </div>
    <svg class="lanes" id="lanes" viewBox="0 0 350 480" preserveAspectRatio="xMidYMid meet">
      <g id="lines"></g>
      <g id="strings"></g>
      <path class="bent" id="bent"/>
    </svg>
  </section>

  <div class="bottom">
    <button id="autoBtn" aria-pressed="true">자동 감지</button>
    <button id="startBtn">시작</button>
  </div>
  <div class="err" id="err"></div>
</main>

<script>
const TUNINGS = {
  guitar: { minF: 70, maxF: 400, strings: [
    {n:'E',o:2,m:40,g:5},{n:'A',o:2,m:45,g:4},{n:'D',o:3,m:50,g:4},
    {n:'G',o:3,m:55,g:3},{n:'B',o:3,m:59,g:2},{n:'E',o:4,m:64,g:2}]},
  bass: { minF: 35, maxF: 120, strings: [
    {n:'E',o:1,m:28,g:7},{n:'A',o:1,m:33,g:6},{n:'D',o:2,m:38,g:5},{n:'G',o:2,m:43,g:4}]}
};
const IN_TUNE = 3;      // ±센트
const GATE_RMS = 0.008; // 이하 무음 처리
const HOLD_MS = 900;

const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v = localStorage.getItem('tuner.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('tuner.'+k, JSON.stringify(v)); }catch(e){} }
};

let inst = store.get('inst','guitar');
let a4 = store.get('a4',440);
let auto = true, locked = 0;
let ctx=null, analyser=null, stream=null, buf=null, raf=0, wake=null;
let hist=[], smooth=null, curIdx=-1, lastHeard=0, frame=0;

// 줄 휨: 낮으면 아래로 처지고 높으면 위로 팽팽히 휜다. 맞으면 직선.
// 관성: 스프링-댐퍼 (감지 로직과 분리, 목표 센트만 받음)
const BEND_PX=0.9;
const bentEl=$('bent');
const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)');
let nPos=0, nVel=0, nTarget=0, nRaf=0, nLast=0;
function renderNeedle(){
  if(curIdx<0){ bentEl.setAttribute('d',''); return; }
  const y=laneY(curIdx), sag=-nPos*BEND_PX, mx=(LX0+LX1)/2;
  bentEl.setAttribute('d',`M${LX0} ${y} Q${mx} ${(y+2*sag).toFixed(1)} ${LX1} ${y}`);
}
function stepNeedle(t){
  const dt=Math.min(0.05,(t-nLast)/1000||0.016); nLast=t;
  const K=70, C=9.5; // 약한 부족감쇠: 살짝 넘쳤다가 안착
  nVel+=(K*(nTarget-nPos)-C*nVel)*dt;
  nPos+=nVel*dt;
  if(nPos>56){ nPos=56; nVel=-nVel*0.3; } else if(nPos<-56){ nPos=-56; nVel=-nVel*0.3; }
  renderNeedle();
  if(Math.abs(nTarget-nPos)<0.05&&Math.abs(nVel)<0.1){ nPos=nTarget; nVel=0; renderNeedle(); nRaf=0; return; }
  nRaf=requestAnimationFrame(stepNeedle);
}
function setNeedle(c){
  nTarget=Math.max(-50,Math.min(50,c));
  if(reduceMotion.matches){ nPos=nTarget; nVel=0; renderNeedle(); return; }
  if(!nRaf){ nLast=performance.now(); nRaf=requestAnimationFrame(stepNeedle); }
}

const freqOf = m => a4 * Math.pow(2,(m-69)/12);

const NS='http://www.w3.org/2000/svg', LANE=80, LX0=64, LX1=346;
const laneY=i=>40+i*LANE;
const el=(tag,attrs,parent)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); parent&&parent.appendChild(e); return e; };
function renderStrings(){
  const box=$('strings'), lines=$('lines'); box.textContent=''; lines.textContent='';
  const list=TUNINGS[inst].strings;
  $('lanes').setAttribute('viewBox',`0 0 350 ${list.length*LANE}`);
  list.forEach((s,i)=>{
    const y=laneY(i);
    el('line',{class:'ln',x1:LX0,y1:y,x2:LX1,y2:y,'stroke-width':Math.max(2,5-i*.5)},lines);
    const g=el('g',{class:'str',tabindex:0,role:'button','aria-label':`${s.n}${s.o} 줄`},box);
    el('rect',{class:'hit',x:0,y:y-LANE/2,width:350,height:LANE},g);
    el('circle',{class:'peg',cx:32,cy:y,r:26},g);
    const t=el('text',{x:32,y:y+4},g); t.textContent=s.n;
    const o=el('text',{class:'oct',x:32,y:y+18},g); o.textContent=s.o;
    const pick=()=>{ auto=false; locked=i; syncAuto(); setActive(i); };
    g.addEventListener('click',pick);
    g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } });
  });
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.inst===inst));
  showNote(list[0]);
  setActive(auto?-1:locked);
}
function setActive(i){
  curIdx=i;
  [...$('strings').children].forEach((el,k)=>{
    el.classList.toggle('active',k===i);
    el.classList.toggle('locked',!auto&&k===locked);
  });
  renderNeedle();
}
function syncAuto(){
  $('autoBtn').setAttribute('aria-pressed',auto);
  $('autoBtn').textContent = auto ? '자동 감지' : '수동 (자동으로 전환)';
  setActive(auto?curIdx:locked);
}
function showNote(s){ $('note').innerHTML=`${s.n}<sub>${s.o}</sub>`; }
function setRef(v){
  a4=Math.max(430,Math.min(450,v)); store.set('a4',a4);
  $('refVal').textContent=a4+'Hz';
}

document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  inst=b.dataset.inst; store.set('inst',inst); locked=0; smooth=null; hist=[]; renderStrings();
});
$('refDown').onclick=()=>setRef(a4-1);
$('refUp').onclick=()=>setRef(a4+1);
$('autoBtn').onclick=()=>{ auto=!auto; syncAuto(); };
$('startBtn').onclick=()=> ctx ? stop() : start();

// YIN 음정 감지
function yin(x, sr, minF, maxF){
  const maxTau=Math.min(Math.floor(sr/minF), x.length>>1);
  const minTau=Math.max(2,Math.floor(sr/maxF));
  const W=x.length-maxTau;
  const d=new Float32Array(maxTau+1);
  for(let tau=1;tau<=maxTau;tau++){
    let s=0;
    for(let j=0;j<W;j++){ const v=x[j]-x[j+tau]; s+=v*v; }
    d[tau]=s;
  }
  // 누적 평균 정규화
  let run=0; d[0]=1;
  for(let tau=1;tau<=maxTau;tau++){ run+=d[tau]; d[tau]=run?d[tau]*tau/run:1; }
  let tau=-1;
  for(let t=minTau;t<maxTau;t++){
    if(d[t]<0.15){ while(t+1<maxTau&&d[t+1]<d[t]) t++; tau=t; break; }
  }
  if(tau<0) return -1;
  const a=d[tau-1], b=d[tau], c=d[tau+1];
  const den=a+c-2*b;
  const better = den ? tau + (a-c)/(2*den) : tau;
  return sr/better;
}

function tick(){
  raf=requestAnimationFrame(tick);
  if((frame++)&1) return; // 약 30fps
  analyser.getFloatTimeDomainData(buf);
  let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  const now=performance.now();
  const T=TUNINGS[inst];
  let f=-1;
  if(rms>GATE_RMS) f=yin(buf,ctx.sampleRate,T.minF,T.maxF);
  if(f>0){
    hist.push(f); if(hist.length>5) hist.shift();
    const med=[...hist].sort((p,q)=>p-q)[hist.length>>1];
    let idx=locked;
    if(auto){
      let best=1e9;
      T.strings.forEach((s,i)=>{ const c=Math.abs(1200*Math.log2(med/freqOf(s.m))); if(c<best){best=c;idx=i;} });
    }
    if(idx!==curIdx){ smooth=null; setActive(idx); }
    const s=T.strings[idx];
    const cents=1200*Math.log2(med/freqOf(s.m));
    smooth = smooth===null ? cents : smooth*0.7+cents*0.3;
    lastHeard=now;
    draw(s,smooth,med);
  } else if(now-lastHeard>HOLD_MS){
    idle();
  }
}
function draw(s,c,f){
  showNote(s);
  setNeedle(c);
  const r=Math.round(c);
  const good=Math.abs(c)<=IN_TUNE;
  $('readout').dataset.state = good ? 'good' : (Math.abs(c)<=10 ? 'near' : 'off');
  $('status').textContent = good ? '맞음' : (r<0 ? `${-r}센트 낮음, 조이세요` : `${r}센트 높음, 푸세요`);
  $('hz').textContent = `${f.toFixed(1)}Hz, 목표 ${freqOf(s.m).toFixed(1)}Hz`;
  [...$('strings').children].forEach((el,k)=>el.classList.toggle('ring',k===curIdx));
}
function idle(){
  if($('readout').dataset.state==='idle') return;
  $('readout').dataset.state='idle';
  $('status').textContent='줄을 튕기세요';
  $('hz').textContent='';
  hist=[]; smooth=null; setNeedle(0);
  [...$('strings').children].forEach(el=>el.classList.remove('ring'));
  if(auto) setActive(-1);
}

async function start(){
  $('err').textContent='';
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    $('err').textContent = e && e.name==='NotAllowedError'
      ? '마이크 권한이 꺼져 있습니다. 브라우저 설정에서 이 페이지의 마이크를 허용한 뒤 다시 시작하세요.'
      : '마이크를 열 수 없습니다. 다른 앱이 마이크를 쓰고 있지 않은지 확인하세요.';
    return;
  }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(stream);
  analyser=ctx.createAnalyser(); analyser.fftSize=4096;
  src.connect(analyser);
  buf=new Float32Array(analyser.fftSize);
  try{ wake=await navigator.wakeLock?.request('screen'); }catch(e){}
  $('startBtn').textContent='정지'; $('startBtn').classList.add('on');
  $('status').textContent='줄을 튕기세요';
  tick();
}
function stop(){
  cancelAnimationFrame(raf);
  stream?.getTracks().forEach(t=>t.stop());
  ctx?.close(); ctx=null;
  try{ wake?.release(); }catch(e){} wake=null;
  $('startBtn').textContent='시작'; $('startBtn').classList.remove('on');
  idle(); $('status').textContent='시작을 누르고 줄을 튕기세요';
}

setRef(a4);
renderStrings();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
