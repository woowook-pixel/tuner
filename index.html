<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>튜너</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="튜너">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F4F5F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E5EA; --tile:#EDEFF3;
  --good:#16A34A; --off:#F97316; --sc:var(--muted);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:12px 20px 16px}

/* 상단: 모드 표시와 설정만 */
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--card);
  box-shadow:0 1px 2px rgba(15,23,42,.08);font-size:14px;font-weight:600;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip[aria-pressed="true"] i{background:var(--good);box-shadow:0 0 0 4px rgba(22,163,74,.18)}
.tools{display:flex;gap:8px}
.icon{width:44px;height:44px;border:0;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(15,23,42,.08);
  display:grid;place-items:center;cursor:pointer}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.big{width:44px;height:44px}
.ic.sm{width:18px;height:18px}
.icon svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.left{display:flex;align-items:center;gap:8px}
#stopBtn{width:auto;padding:0 16px;border-radius:999px;font-size:14px;font-weight:700;display:none;align-items:center;gap:6px}
#stopBtn svg{width:16px;height:16px;fill:currentColor;stroke:none}
body[data-run="1"] #stopBtn{display:inline-flex}

/* 중앙: 음 원판 + 높낮이 막대 */
.readout{display:flex;flex-direction:column;align-items:center;padding-top:10px;--sc:var(--muted)}
.readout[data-state="near"],.readout[data-state="off"]{--sc:var(--off)}
.readout[data-state="good"]{--sc:var(--good)}
.orb{width:min(56vw,220px);aspect-ratio:1;border-radius:50%;background:var(--card);border:8px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(15,23,42,.08);transition:border-color .2s,background .2s,color .2s}
.readout[data-state="near"] .orb,.readout[data-state="off"] .orb{border-color:var(--off)}
.readout[data-state="good"] .orb{border-color:var(--good);background:var(--good);color:#fff}
.note{font-weight:800;font-size:clamp(76px,24vw,100px);line-height:.95;letter-spacing:-.04em}
.readout[data-state="idle"] .note{color:var(--line)}
.note sub{font-size:.28em;font-weight:700;color:var(--muted);vertical-align:baseline;margin-left:2px;letter-spacing:0}
.readout[data-state="good"] .note sub{color:rgba(255,255,255,.8)}
.cents{font-size:18px;font-weight:700;color:var(--muted);min-height:1.3em;font-variant-numeric:tabular-nums}
.readout[data-state="good"] .cents{color:#fff}
.msg{margin-top:16px;text-align:center;min-height:56px}
.status .ar{font-size:.8em;margin-right:4px}
.status{font-size:20px;font-weight:700;min-height:1.4em}
.readout[data-state="good"] .status{color:var(--good)}
.readout[data-state="near"] .status,.readout[data-state="off"] .status{color:var(--off)}
.hz{margin-top:2px;font-size:13px;color:var(--muted);min-height:1.3em;font-variant-numeric:tabular-nums}
#startBtn{display:none;height:56px;padding:0 32px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 16px rgba(15,23,42,.25)}
body[data-run="0"] #startBtn{display:inline-flex;align-items:center;gap:10px}
body[data-run="0"] .msg .status,body[data-run="0"] .msg .hz{display:none}
.err{font-size:14px;font-weight:600;text-align:center;min-height:1.2em;margin-top:6px;color:var(--off)}

.bar{position:relative;width:100%;height:48px;margin-top:6px}
.bar .track{position:absolute;left:0;right:0;top:18px;height:12px;border-radius:6px;background:var(--tile)}
.bar .zone{position:absolute;top:14px;height:20px;left:46.5%;width:7%;border-radius:6px;background:var(--good);opacity:.25}
.bar .knob{position:absolute;top:10px;left:50%;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--card);
  border:5px solid var(--sc);box-shadow:0 2px 6px rgba(15,23,42,.25);will-change:left;transition:border-color .2s}
.readout[data-state="idle"] .knob{opacity:.5}
.bar .lab{position:absolute;top:34px;font-size:12px;font-weight:600;color:var(--muted)}

/* 하단: 헤드스톡 (탭하면 그 줄로 고정) */
.stock{flex:1;min-height:0;width:100%;display:block;margin-top:6px}
.hd{fill:var(--card);stroke:var(--line);stroke-width:2}
.stem{stroke:var(--line);stroke-width:6;stroke-linecap:round}
.post{fill:var(--tile)}
.peg{cursor:pointer;outline:none}
.peg .hit{fill:transparent}
.peg .pc{fill:var(--card);stroke:var(--line);stroke-width:3;transition:fill .15s,stroke .15s}
.peg text{fill:var(--ink);font:800 22px "IBM Plex Sans KR",system-ui,sans-serif;text-anchor:middle;pointer-events:none}
.peg .oc{font-size:11px;font-weight:700;fill:var(--muted)}
.peg.active .pc{stroke:var(--sc);fill:var(--card);stroke-width:5}
.readout[data-state="near"] ~ .stock .peg.active .pc,.readout[data-state="off"] ~ .stock .peg.active .pc{stroke:var(--off)}
.readout[data-state="good"] ~ .stock .peg.active .pc{fill:var(--good);stroke:var(--good)}
.readout[data-state="good"] ~ .stock .peg.active text{fill:#fff}
.peg.locked .pc{fill:var(--ink);stroke:var(--ink)}
.peg.locked text{fill:#fff}
.peg.locked .oc{fill:rgba(255,255,255,.7)}
.peg:focus-visible .pc{stroke:var(--ink);stroke-width:5}
.peg.ring .pc{animation:pulse .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}
@media (prefers-reduced-motion:reduce){.peg.ring .pc{animation:none}.orb{transition:none}}

/* 설정 시트 */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 14px;font-size:18px}
.sheet h3{margin:20px 0 8px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid var(--line);border-radius:16px;background:var(--card);font-size:16px;font-weight:700;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.opt small{display:block;margin-top:-2px;font-size:12px;font-weight:500;opacity:.7}
.refrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.refrow p{margin:0;font-size:13px;line-height:1.5;color:var(--muted);flex:1}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border:0;border-radius:50%;background:var(--tile);font-size:22px;cursor:pointer}
.step output{min-width:72px;text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.done{width:100%;height:52px;margin-top:22px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body data-run="0">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="ic-guitar" viewBox="0 0 48 48"><g stroke="currentColor" stroke-linecap="round" fill="none"><line x1="8.0" y1="6" x2="8.0" y2="43" stroke-width="2.4"/><line x1="14.4" y1="6" x2="14.4" y2="43" stroke-width="2.0"/><line x1="20.8" y1="6" x2="20.8" y2="43" stroke-width="1.7"/><line x1="27.2" y1="6" x2="27.2" y2="43" stroke-width="1.4"/><line x1="33.6" y1="6" x2="33.6" y2="43" stroke-width="1.0"/><line x1="40.0" y1="6" x2="40.0" y2="43" stroke-width="0.6"/></g><rect x="3" y="15" width="42" height="7" rx="3.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ic-bass" viewBox="0 0 48 48"><g stroke="currentColor" stroke-linecap="round" fill="none"><line x1="8.0" y1="6" x2="8.0" y2="43" stroke-width="3.6"/><line x1="18.7" y1="6" x2="18.7" y2="43" stroke-width="2.7"/><line x1="29.3" y1="6" x2="29.3" y2="43" stroke-width="1.8"/><line x1="40.0" y1="6" x2="40.0" y2="43" stroke-width="0.9"/></g><rect x="3" y="15" width="42" height="7" rx="3.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ic-mic" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11.5" rx="3" fill="currentColor" stroke="none"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M8.5 21.5h7"/></symbol>
  <symbol id="ic-stop" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="3" fill="currentColor" stroke="none"/></symbol>

</svg>
<main class="app">
  <div class="top">
    <div class="left">
      <button class="icon" id="instBtn" aria-label="악기 선택"><svg class="ic" style="width:28px;height:28px"><use id="instUse" href="#ic-guitar"/></svg></button>
      <button class="chip" id="autoChip" aria-pressed="true"><i></i><span id="autoTxt">자동 감지</span></button>
    </div>
    <div class="tools">
      <button class="icon" id="stopBtn" aria-label="정지"><svg class="ic"><use href="#ic-stop"/></svg>정지</button>
      <button class="icon" id="gearBtn" aria-label="설정">
        <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1zM12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6Z"/></svg>
      </button>
    </div>
  </div>

  <section class="readout" id="readout" data-state="idle">
    <div class="orb">
      <div class="note" id="note">E<sub>2</sub></div>
      <div class="cents" id="cents"></div>
    </div>
    <div class="msg" aria-live="polite">
      <button id="startBtn"><svg class="ic"><use href="#ic-mic"/></svg>마이크 켜고 시작</button>
      <div class="status" id="status">줄을 튕기세요</div>
      <div class="hz" id="hz"></div>
    </div>
    <div class="bar" aria-hidden="true">
      <div class="track"></div><div class="zone"></div><div class="knob" id="knob"></div>
      <span class="lab" style="left:0">낮음</span><span class="lab" style="left:50%;transform:translateX(-50%)">맞음</span><span class="lab" style="right:0">높음</span>
    </div>
    <div class="err" id="err"></div>
  </section>

  <svg class="stock" id="stock" viewBox="0 0 320 330" preserveAspectRatio="xMidYMid meet" role="group" aria-label="줄 선택 (탭하면 그 줄로 고정)">
    <g id="deco"></g>
    <g id="pegs"></g>
  </svg>
  <div class="hint" id="hint">줄을 탭하면 그 줄로 고정됩니다</div>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="설정">
    <div class="grab"></div>
    <h2>설정</h2>
    <h3>악기 선택</h3>
    <div class="opts">
      <button class="opt" data-inst="guitar" aria-pressed="true"><svg class="ic big"><use href="#ic-guitar"/></svg>기타<small>6현 E A D G B E</small></button>
      <button class="opt" data-inst="bass" aria-pressed="false"><svg class="ic big"><use href="#ic-bass"/></svg>베이스<small>4현 E A D G</small></button>
    </div>
    <h3><svg class="ic sm"><use href="#ic-fork"/></svg>기준음 (A4)</h3>
    <div class="refrow">
      <p>피아노 등 다른 악기와 음높이를 맞출 때만 바꿉니다. 보통은 440Hz 그대로 두면 됩니다.</p>
      <div class="step">
        <button id="refDown" aria-label="기준음 낮추기">−</button>
        <output id="refVal">440Hz</output>
        <button id="refUp" aria-label="기준음 높이기">+</button>
      </div>
    </div>
    <button class="done" id="doneBtn">완료</button>
  </div>
</div>

<script>
const TUNINGS = {
  guitar: { minF: 70, maxF: 400, strings: [
    {n:'E',o:2,m:40,g:5},{n:'A',o:2,m:45,g:4},{n:'D',o:3,m:50,g:4},
    {n:'G',o:3,m:55,g:3},{n:'B',o:3,m:59,g:2},{n:'E',o:4,m:64,g:2}]},
  bass: { minF: 35, maxF: 120, strings: [
    {n:'E',o:1,m:28,g:7},{n:'A',o:1,m:33,g:6},{n:'D',o:2,m:38,g:5},{n:'G',o:2,m:43,g:4}]}
};
// 헤드스톡 페그 배치(위에서 아래): 왼쪽/오른쪽에 놓일 줄 번호
// 베이스는 펜더식 4-in-line: 페그 4개가 한쪽에 일렬이고 팁 쪽이 G, 너트 쪽이 E
const PEGS = { guitar:{L:[2,1,0],R:[3,4,5]}, bass:{L:[3,2,1,0],R:[]} };
const IN_TUNE = 3;      // ±센트
const GATE_RMS = 0.008; // 이하 무음 처리
const HOLD_MS = 900;

const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v = localStorage.getItem('tuner.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('tuner.'+k, JSON.stringify(v)); }catch(e){} }
};

let inst = store.get('inst','guitar');
let a4 = store.get('a4',440);
let auto = true, locked = 0;
let ctx=null, analyser=null, stream=null, buf=null, raf=0, wake=null;
let hist=[], smooth=null, curIdx=-1, lastHeard=0, frame=0;
let pegEls=[];

// 높낮이 막대의 손잡이: 스프링-댐퍼 관성 (감지 로직과 분리, 목표 센트만 받음)
const knobEl=$('knob');
const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)');
let nPos=0, nVel=0, nTarget=0, nRaf=0, nLast=0;
function renderNeedle(){ knobEl.style.left=(50+nPos*0.9).toFixed(2)+'%'; }
function stepNeedle(t){
  const dt=Math.min(0.05,(t-nLast)/1000||0.016); nLast=t;
  const K=70, C=9.5; // 약한 부족감쇠: 살짝 넘쳤다가 안착
  nVel+=(K*(nTarget-nPos)-C*nVel)*dt;
  nPos+=nVel*dt;
  if(nPos>56){ nPos=56; nVel=-nVel*0.3; } else if(nPos<-56){ nPos=-56; nVel=-nVel*0.3; }
  renderNeedle();
  if(Math.abs(nTarget-nPos)<0.05&&Math.abs(nVel)<0.1){ nPos=nTarget; nVel=0; renderNeedle(); nRaf=0; return; }
  nRaf=requestAnimationFrame(stepNeedle);
}
function setNeedle(c){
  nTarget=Math.max(-50,Math.min(50,c));
  if(reduceMotion.matches){ nPos=nTarget; nVel=0; renderNeedle(); return; }
  if(!nRaf){ nLast=performance.now(); nRaf=requestAnimationFrame(stepNeedle); }
}
renderNeedle();

const freqOf = m => a4 * Math.pow(2,(m-69)/12);

// 헤드스톡 그리기
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); parent&&parent.appendChild(e); return e; };
function renderStrings(){
  const deco=$('deco'), box=$('pegs'); deco.textContent=''; box.textContent=''; pegEls=[];
  const HEAD={
    guitar:'M130 330 L130 250 C130 222 110 208 110 182 L110 50 Q110 12 160 12 Q210 12 210 50 L210 182 C210 208 190 222 190 250 L190 330 Z',
    bass:'M134 330 L134 254 C134 236 106 224 104 196 L104 62 C104 28 128 12 158 12 C182 12 198 26 198 54 L198 92 C198 112 190 130 190 158 L190 254 L190 330 Z'
  };
  el('path',{class:'hd',d:HEAD[inst]},deco);
  const P=PEGS[inst], list=TUNINGS[inst].strings;
  const ys = n => n===4 ? [46,104,162,220] : [62,128,194];
  (inst==='bass' ? [['L',44,106]] : [['L',44,112],['R',276,208]]).forEach(([side,px,hx])=>{
    const idxs=P[side], yy=ys(idxs.length);
    idxs.forEach((si,k)=>{
      const y=yy[k], s=list[si];
      el('line',{class:'stem',x1:hx,y1:y,x2:px,y2:y},deco);
      el('circle',{class:'post',cx:inst==='bass'?126:(side==='L'?132:188),cy:y,r:8},deco);
      const g=el('g',{class:'peg',tabindex:0,role:'button','aria-label':`${s.n}${s.o} 줄`},box);
      el('circle',{class:'hit',cx:px,cy:y,r:34},g);
      el('circle',{class:'pc',cx:px,cy:y,r:27},g);
      const t=el('text',{x:px,y:y+2},g); t.textContent=s.n;
      const o=el('text',{class:'oc',x:px,y:y+16},g); o.textContent=s.o;
      const pick=()=>{
        if(!auto&&locked===si){ auto=true; syncAuto(); setActive(-1); return; }
        auto=false; locked=si; showNote(s); syncAuto(); setActive(si);
      };
      g.addEventListener('click',pick);
      g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } });
      pegEls[si]=g;
    });
  });
  document.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x.dataset.inst===inst));
  $('instUse').setAttribute('href','#ic-'+inst);
  showNote(list[0]);
  syncAuto();
  setActive(auto?-1:locked);
}
function setActive(i){
  curIdx=i;
  pegEls.forEach((el,k)=>{
    el.classList.toggle('active',k===i);
    el.classList.toggle('locked',!auto&&k===locked);
  });
}
function syncAuto(){
  const s=TUNINGS[inst].strings[locked];
  $('autoChip').setAttribute('aria-pressed',auto);
  $('autoTxt').textContent = auto ? '자동 감지' : `${s.n}${s.o} 줄 고정 (탭하면 자동)`;
  $('hint').textContent = auto ? '줄을 탭하면 그 줄로 고정됩니다' : '고정한 줄을 다시 탭하면 자동 감지로 돌아갑니다';
  setActive(auto?curIdx:locked);
}
function showNote(s){ $('note').innerHTML=`${s.n}<sub>${s.o}</sub>`; }
function setRef(v){
  a4=Math.max(430,Math.min(450,v)); store.set('a4',a4);
  $('refVal').textContent=a4+'Hz';
}

document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  inst=b.dataset.inst; store.set('inst',inst); locked=0; smooth=null; hist=[]; auto=true; renderStrings();
});
$('refDown').onclick=()=>setRef(a4-1);
$('refUp').onclick=()=>setRef(a4+1);
$('autoChip').onclick=()=>{ if(!auto){ auto=true; syncAuto(); setActive(-1); } };
$('startBtn').onclick=start;
$('stopBtn').onclick=stop;
const sheet=$('scrim');
const openSheet=()=>{ sheet.hidden=false; $('doneBtn').focus(); };
const closeSheet=()=>{ sheet.hidden=true; $('gearBtn').focus(); };
$('gearBtn').onclick=openSheet;
$('instBtn').onclick=openSheet;
$('doneBtn').onclick=closeSheet;
sheet.addEventListener('click',e=>{ if(e.target===sheet) closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!sheet.hidden) closeSheet(); });

// YIN 음정 감지
function yin(x, sr, minF, maxF){
  const maxTau=Math.min(Math.floor(sr/minF), x.length>>1);
  const minTau=Math.max(2,Math.floor(sr/maxF));
  const W=x.length-maxTau;
  const d=new Float32Array(maxTau+1);
  for(let tau=1;tau<=maxTau;tau++){
    let s=0;
    for(let j=0;j<W;j++){ const v=x[j]-x[j+tau]; s+=v*v; }
    d[tau]=s;
  }
  // 누적 평균 정규화
  let run=0; d[0]=1;
  for(let tau=1;tau<=maxTau;tau++){ run+=d[tau]; d[tau]=run?d[tau]*tau/run:1; }
  let tau=-1;
  for(let t=minTau;t<maxTau;t++){
    if(d[t]<0.15){ while(t+1<maxTau&&d[t+1]<d[t]) t++; tau=t; break; }
  }
  if(tau<0) return -1;
  const a=d[tau-1], b=d[tau], c=d[tau+1];
  const den=a+c-2*b;
  const better = den ? tau + (a-c)/(2*den) : tau;
  return sr/better;
}

function tick(){
  raf=requestAnimationFrame(tick);
  if((frame++)&1) return; // 약 30fps
  analyser.getFloatTimeDomainData(buf);
  let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  const now=performance.now();
  const T=TUNINGS[inst];
  let f=-1;
  if(rms>GATE_RMS) f=yin(buf,ctx.sampleRate,T.minF,T.maxF);
  if(f>0){
    hist.push(f); if(hist.length>5) hist.shift();
    const med=[...hist].sort((p,q)=>p-q)[hist.length>>1];
    let idx=locked;
    if(auto){
      let best=1e9;
      T.strings.forEach((s,i)=>{ const c=Math.abs(1200*Math.log2(med/freqOf(s.m))); if(c<best){best=c;idx=i;} });
    }
    if(idx!==curIdx){ smooth=null; setActive(idx); }
    const s=T.strings[idx];
    const cents=1200*Math.log2(med/freqOf(s.m));
    smooth = smooth===null ? cents : smooth*0.7+cents*0.3;
    lastHeard=now;
    draw(s,smooth,med);
  } else if(now-lastHeard>HOLD_MS){
    idle();
  }
}
function draw(s,c,f){
  showNote(s);
  setNeedle(c);
  const r=Math.round(c);
  const good=Math.abs(c)<=IN_TUNE;
  $('readout').dataset.state = good ? 'good' : (Math.abs(c)<=10 ? 'near' : 'off');
  $('cents').textContent = good ? '맞음' : `${r>0?'+':'−'}${Math.abs(r)}센트`;
  $('status').innerHTML = good ? '정확합니다' : (r<0 ? '<span class="ar">▲</span>낮습니다, 조이세요' : '<span class="ar">▼</span>높습니다, 푸세요');
  $('hz').textContent = `${f.toFixed(1)}Hz, 목표 ${freqOf(s.m).toFixed(1)}Hz`;
  pegEls.forEach((el,k)=>el.classList.toggle('ring',k===curIdx));
}
function idle(){
  if($('readout').dataset.state==='idle') return;
  $('readout').dataset.state='idle';
  $('status').textContent='줄을 튕기세요';
  $('cents').textContent='';
  $('hz').textContent='';
  hist=[]; smooth=null; setNeedle(0);
  pegEls.forEach(el=>el.classList.remove('ring'));
  if(auto) setActive(-1);
}

async function start(){
  $('err').textContent='';
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    $('err').textContent = e && e.name==='NotAllowedError'
      ? '마이크 권한이 꺼져 있습니다. 브라우저 설정에서 이 페이지의 마이크를 허용한 뒤 다시 시작하세요.'
      : '마이크를 열 수 없습니다. 다른 앱이 마이크를 쓰고 있지 않은지 확인하세요.';
    return;
  }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(stream);
  analyser=ctx.createAnalyser(); analyser.fftSize=4096;
  src.connect(analyser);
  buf=new Float32Array(analyser.fftSize);
  try{ wake=await navigator.wakeLock?.request('screen'); }catch(e){}
  document.body.dataset.run='1';
  $('status').textContent='줄을 튕기세요';
  tick();
}
function stop(){
  cancelAnimationFrame(raf);
  stream?.getTracks().forEach(t=>t.stop());
  ctx?.close(); ctx=null;
  try{ wake?.release(); }catch(e){} wake=null;
  document.body.dataset.run='0';
  idle();
}

setRef(a4);
renderStrings();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
